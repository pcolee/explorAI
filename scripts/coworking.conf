# Settings for the shared coworking kit (scripts/sync.sh, context.sh, review.mjs, hooks/), sourced by bash.
# The kit's files are identical in rcc-gdg, rcc-acm, and pcolee/explorAI; only this file differs.
LABEL="the ExplorAI decks repo"
BRIDGE_WORDS='explor ?ai|pcolee'
DECKS='meetings/*/index.html'
PUSH_NOTE="live on GitHub Pages in about a minute"
# Each meeting's speaker notes live beside its deck; the counts must match (scripts/check.sh).
deck_extra() { local n; n="$(dirname "$1")/notes.html"; [ -f "$n" ] && echo ", notes $(grep -o '<article class="note"' "$n" | wc -l | tr -d ' ')" || echo ", no notes"; }
live_url() { echo "${site:+$site/$(dirname "$1")/}"; }
